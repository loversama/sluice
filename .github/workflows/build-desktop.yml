# Builds and publishes the Windows installer.
#
# Tag-driven, not branch-driven: pushing to a feature branch never produces a release, and
# tagging is a deliberate act. The job additionally refuses to run for a tag that is not an
# ancestor of the default branch, so a tag pushed from a side branch by accident cannot
# publish an installer built from unreviewed code.
name: Build Sluice Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write # creating the release

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ancestry check below needs history

      - name: Refuse tags that are not on the default branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          DEFAULT="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT" --quiet
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT"; then
            echo "Tag is on $DEFAULT."
          else
            echo "::error::${{ github.ref_name }} is not on $DEFAULT. Merge first, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build the dashboard
        run: npm run build:web

      - name: Build the workspace
        run: npm run build

      - name: Build the Electron bundles
        run: npm --prefix packages/desktop run build

      - name: Check the version matches the tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG="v$(node -p "require('./packages/desktop/package.json').version")"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "::error::Tag $TAG does not match package version $PKG."
            exit 1
          fi

      - name: Decide whether to publish
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.publish }}" == "true" ]]; then
            echo "flag=always" >> "$GITHUB_OUTPUT"
          else
            echo "flag=never" >> "$GITHUB_OUTPUT"
          fi

      # electron-builder publishes the installer, then makes a second call to attach
      # latest.yml - the file the updater actually reads. That call creates a *published*
      # release, and GitHub refuses to publish one whose tag does not exist in the target
      # repository. The source tag lives in this repo; the release lives in the other. So
      # the tag has to exist in both, and it is made here rather than by hand.
      - name: Mirror the tag into the releases repo
        if: steps.publish.outputs.flag == 'always'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # No leading slash: this runs under Git Bash on Windows, which rewrites a
          # leading-slash argument into a Windows path - /repos/... arrived as
          # "C:/Program Files/Git/repos/...".
          SHA=$(gh api repos/loversama/sluice-releases/git/refs/heads/main --jq .object.sha)
          gh api -X POST repos/loversama/sluice-releases/git/refs \
            -f ref="refs/tags/$TAG" -f sha="$SHA" \
            || echo "Tag $TAG already there; carrying on."

      - name: Build the installer and publish
        working-directory: packages/desktop
        shell: bash
        env:
          # Writes to the separate releases repo, so the built-in GITHUB_TOKEN - which only
          # covers this one - is not enough. Needs contents:write on sluice-releases.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Clear any release for this tag first, then retry - the pattern taken from
          # mt-database-v2, which has been publishing this way for a while.
          #
          # electron-builder creates the release, then uploads the installer, the blockmap
          # and latest.yml to it. If a release for the tag already exists in any state -
          # left by a failed run, or created twice by electron-builder itself - the uploads
          # land inconsistently: a first attempt here produced two releases for one tag,
          # holding a blockmap and nothing else. A release missing its exe is worse than no
          # release, and one missing latest.yml is worse still, because updating then fails
          # silently.
          for attempt in 1 2 3; do
            echo "Attempt $attempt: clearing any existing release for $TAG"
            gh release delete "$TAG" --repo loversama/sluice-releases --yes 2>/dev/null || true
            sleep 2
            if npx electron-builder --win --publish ${{ steps.publish.outputs.flag }}; then
              echo "Published on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed; trying again."
            sleep 5
          done
          echo "::error::Could not publish $TAG after three attempts."
          exit 1

      # electron-builder writes no release body, so a published release arrives blank
      # unless something fills it. The annotated tag's own message is the obvious source:
      # it is written at the moment of tagging, by whoever decided what the release is.
      - name: Put the tag's message in the release notes
        if: steps.publish.outputs.flag == 'always'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [[ -z "${NOTES// }" ]]; then
            echo "::warning::$TAG has no message, so the release notes are empty. Tag with -a next time."
            exit 0
          fi
          printf '%s' "$NOTES" > notes.md
          gh release edit "$TAG" --repo loversama/sluice-releases --notes-file notes.md \
            || echo "::warning::Could not set the release notes; the release itself is fine."

      - name: Keep the installer as an artifact either way
        uses: actions/upload-artifact@v4
        with:
          name: sluice-windows
          path: |
            packages/desktop/release/**/*.exe
            packages/desktop/release/**/*.blockmap
            packages/desktop/release/**/latest.yml
          if-no-files-found: warn
