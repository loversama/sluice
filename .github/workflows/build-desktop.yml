# Builds and publishes the Windows installer.
#
# Tag-driven, not branch-driven: pushing to a feature branch never produces a release, and
# tagging is a deliberate act. The job additionally refuses to run for a tag that is not an
# ancestor of the default branch, so a tag pushed from a side branch by accident cannot
# publish an installer built from unreviewed code.
name: Build Sluice Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Releases"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write # creating the release

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ancestry check below needs history

      - name: Refuse tags that are not on the default branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          DEFAULT="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT" --quiet
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT"; then
            echo "Tag is on $DEFAULT."
          else
            echo "::error::${{ github.ref_name }} is not on $DEFAULT. Merge first, then tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      # The token says which build is calling the Steam broker, so it is stamped in per
      # release rather than committed. It is cohort control, not a secret - see the comment
      # on CLIENT_TOKEN in packages/core/src/version.ts - but a build that ships the "dev"
      # placeholder is a build the broker will not answer, which is what the check further
      # down refuses to publish.
      - name: Stamp the Steam client token
        if: ${{ secrets.SLUICE_CLIENT_TOKEN != '' }}
        shell: bash
        env:
          CLIENT_TOKEN: ${{ secrets.SLUICE_CLIENT_TOKEN }}
        run: |
          FILE=packages/core/src/version.ts
          node -e '
            const fs = require("node:fs");
            const file = "packages/core/src/version.ts";
            const before = fs.readFileSync(file, "utf8");
            const after = before.replace(
              /^export const CLIENT_TOKEN = ".*";$/m,
              () => `export const CLIENT_TOKEN = "${process.env.CLIENT_TOKEN}";`,
            );
            if (after === before) {
              console.error("::error::CLIENT_TOKEN in " + file + " was not substituted.");
              process.exit(1);
            }
            fs.writeFileSync(file, after);
          '
          echo "Stamped a client token into $FILE."

      - name: Build the dashboard
        run: npm run build:web

      - name: Build the workspace
        run: npm run build

      - name: Type check the desktop shell
        run: npm --prefix packages/desktop run typecheck

      - name: Build the desktop shell
        run: npm --prefix packages/desktop run build

      # Three files carry the version and they have to agree with the tag; only the
      # desktop one used to be checked, so the other two could drift and the mismatch would
      # show up as an update that quietly never applies. The client token is checked in the
      # same breath: a release still carrying the "dev" placeholder installs fine and then
      # cannot read Steam for anybody, which is precisely the kind of failure that has to
      # be caught before publishing rather than after.
      #
      # Read out of the source rather than the build output - version.ts is an ES module
      # and `require` cannot reach into one.
      - name: Check the version and client token
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          node -e '
            const fs = require("node:fs");
            const tag = process.argv[1];
            const source = fs.readFileSync("packages/core/src/version.ts", "utf8");
            const read = (name) =>
              new RegExp(`^export const ${name} = "(.*)";$`, "m").exec(source)?.[1] ?? "";
            const versions = {
              "package.json": require("./package.json").version,
              "packages/desktop/package.json": require("./packages/desktop/package.json").version,
              "packages/core/src/version.ts": read("VERSION"),
            };
            let failed = false;
            for (const [file, version] of Object.entries(versions)) {
              if (`v${version}` !== tag) {
                console.error(`::error::Tag ${tag} does not match ${file}, which says ${version}.`);
                failed = true;
              }
            }
            if (read("CLIENT_TOKEN") === "dev") {
              console.error("::error::This build still carries the placeholder Steam client token.");
              console.error("Set the SLUICE_CLIENT_TOKEN secret; the stamp step earlier reads it.");
              failed = true;
            }
            process.exit(failed ? 1 : 0);
          ' "$TAG"

      - name: Decide whether to publish
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.publish }}" == "true" ]]; then
            echo "flag=always" >> "$GITHUB_OUTPUT"
          else
            echo "flag=never" >> "$GITHUB_OUTPUT"
          fi

      # electron-builder publishes the installer, then makes a second call to attach
      # latest.yml - the file the updater actually reads. That call creates a *published*
      # release, and GitHub refuses to publish one whose tag does not exist in the target
      # repository. The source tag lives in this repo; the release lives in the other. So
      # the tag has to exist in both, and it is made here rather than by hand.
      - name: Mirror the tag into the releases repo
        if: steps.publish.outputs.flag == 'always'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # No leading slash: this runs under Git Bash on Windows, which rewrites a
          # leading-slash argument into a Windows path - /repos/... arrived as
          # "C:/Program Files/Git/repos/...".
          SHA=$(gh api repos/loversama/sluice-releases/git/refs/heads/main --jq .object.sha)
          gh api -X POST repos/loversama/sluice-releases/git/refs \
            -f ref="refs/tags/$TAG" -f sha="$SHA" \
            || echo "Tag $TAG already there; carrying on."

      # Built here, uploaded next. electron-builder's own GitHub publisher was doing both,
      # and across repositories it uploaded the blockmap, skipped the installer and
      # latest.yml, and still exited 0 - leaving a release that looked published and could
      # neither be installed nor updated from. Separating them means the upload either
      # happens or fails loudly.
      - name: Build the installer
        working-directory: packages/desktop
        shell: bash
        run: npx electron-builder --win --publish never

      - name: Publish it
        if: steps.publish.outputs.flag == 'always'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          REPO=loversama/sluice-releases
          shopt -s nullglob
          # electron-builder writes into a directory named for the version, so everything is
          # one level below release/. A recursive glob reaches it, but also sweeps up the
          # unpacked build - a 210MB Sluice.exe and elevate.exe - which are inputs to the
          # installer rather than things anyone should download.
          DIR="packages/desktop/release/${TAG#v}"

          # latest.yml is what the updater reads. Without it a release installs but never
          # offers an update, and nothing about it looks wrong - so its absence fails here
          # rather than being discovered months later.
          #
          # Tested as a file on disk. The previous version looked for the name in the list
          # of paths, and a path with no wildcard in it is in that list whether the file
          # exists or not, so the check passed on a directory that held nothing at all.
          if [[ ! -f "$DIR/latest.yml" ]]; then
            echo "::error::$DIR/latest.yml was not produced; refusing to publish a release nothing can update from."
            echo "What the build actually left behind:"
            ls -R packages/desktop/release || true
            exit 1
          fi

          FILES=("$DIR"/*.exe "$DIR"/*.blockmap "$DIR/latest.yml")
          if [[ ${#FILES[@]} -lt 3 ]]; then
            echo "::error::expected an installer, its blockmap and latest.yml; found: ${FILES[*]}"
            exit 1
          fi

          # The notes are the annotated tag's message, and getting hold of it takes care.
          # actions/checkout leaves behind a lightweight tag pointing at the commit, so
          # %(contents) quietly returns the commit message instead - which is how a release
          # came to be published as "Version 0.4.3" followed by a commit trailer. Fetching
          # the tag object itself is what makes the difference.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "$TAG" 2>/dev/null)" != "tag" ]]; then
            echo "::error::$TAG is not an annotated tag, and its message is the release notes."
            exit 1
          fi

          # Drop the subject line, which repeats the title GitHub already shows, and any
          # trailer, which belongs in git history rather than in notes people read.
          git tag -l --format='%(contents)' "$TAG" \
            | sed -e '1{/^Sluice /d}' \
                  -e '/^[A-Za-z][A-Za-z-]*-Session:/d' \
                  -e '/^Co-authored-by:/d' \
                  -e '/^Signed-off-by:/d' \
            | sed -e '/./,$!d' > notes.md

          if [[ ! -s notes.md ]]; then
            echo "::error::$TAG has an empty message, so the release would have no notes."
            exit 1
          fi

          # A release describes the software, never how it was written. Failing here is the
          # only reliable guard: by the time anyone reads the notes they are already public.
          if grep -qiE 'claude|anthropic|copilot|\bLLM\b' notes.md; then
            echo "::error::the notes name the tooling that produced them. See CLAUDE.md."
            grep -niE 'claude|anthropic|copilot|\bLLM\b' notes.md
            exit 1
          fi

          # Start from nothing: a half-populated release left by an earlier attempt is the
          # exact failure this step exists to avoid.
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$REPO" --title "${TAG#v}" --notes-file notes.md
          # A release is created before it can be uploaded to, so a failed upload leaves a
          # published release with no installer in it. Take it back down rather than leave
          # that standing.
          if ! gh release upload "$TAG" --repo "$REPO" --clobber "${FILES[@]}"; then
            echo "::error::upload failed; removing the empty release it would have left behind."
            gh release delete "$TAG" --repo "$REPO" --yes || true
            exit 1
          fi

          # The updater reads latest.yml, then asks for the file it names. If GitHub is
          # holding that file under any other name the download 404s, the update fails, and
          # nothing about the release looks wrong from the outside - which is exactly how
          # 0.4.1 and 0.4.2 both shipped unable to update themselves.
          WANTED=$(sed -n 's/^path: *//p' "$DIR/latest.yml" | tr -d '\r')
          if [[ -z "$WANTED" ]]; then
            echo "::error::latest.yml has no path: entry, so nothing can be verified."
            gh release delete "$TAG" --repo "$REPO" --yes || true
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qxF "$WANTED"; then
            echo "::error::latest.yml points at '$WANTED', which is not among the published assets:"
            gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
            gh release delete "$TAG" --repo "$REPO" --yes || true
            exit 1
          fi

          echo "Published $TAG with ${#FILES[@]} files; the updater will fetch $WANTED."

      # "Either way" needs saying out loud: without this the step is skipped whenever an
      # earlier one fails, which is precisely when a built installer is worth keeping.
      - name: Keep the installer as an artifact either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sluice-windows
          # One level down, which is the directory named for the version. Two levels down
          # is win-unpacked, whose 210MB Sluice.exe is an input to the installer.
          path: |
            packages/desktop/release/*/*.exe
            packages/desktop/release/*/*.blockmap
            packages/desktop/release/*/latest.yml
          if-no-files-found: warn
