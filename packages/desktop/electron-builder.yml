appId: dev.loversama.sluice
productName: Sluice
copyright: Copyright © 2026

directories:
  output: release/${version}
  buildResources: resources

files:
  - "out/**/*"
  - "!out/**/*.map"

# The dashboard is the same build the container serves. Shipped outside the asar so the
# server reads it with ordinary file APIs, exactly as it does under Docker.
extraResources:
  - from: "../../web/dist"
    to: "web"
  - from: "resources/icon.ico"
    to: "icon.ico"
  # Both tray marks ship: which one is used depends on the taskbar's theme at run time.
  - from: "resources/tray-light.ico"
    to: "tray-light.ico"
  - from: "resources/tray-dark.ico"
    to: "tray-dark.ico"

asar: true
compression: maximum

# No spaces in the file name, ever.
#
# The default is "Sluice Setup 0.4.2.exe", and electron-builder writes that to disk while
# recording the URL-safe "Sluice-Setup-0.4.2.exe" in latest.yml. Its own publisher uploads
# under the sanitised name so the two agree; publishing with `gh` instead uploads the name
# on disk, and GitHub turns the spaces into dots. The updater then asks for the hyphenated
# name, gets a 404, and reports that it cannot download the update - which is how 0.4.1 and
# 0.4.2 both shipped unable to update themselves. Naming it this way leaves nothing for
# anything to sanitise.
artifactName: ${productName}-Setup-${version}.${ext}

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

linux:
  icon: resources/icon.png
  # Lower case and without spaces, so the deb's /usr/bin entry and the process name are
  # what someone would type. The data directory is unaffected: it comes from package.json's
  # name, as on Windows.
  executableName: sluice
  # Names the installed .desktop file after desktopName in package.json, so it matches the
  # window's app_id and the dock groups the window under Sluice rather than as a stranger.
  syncDesktopName: true
  category: Network
  synopsis: Mine Twitch drops in the background
  description: >-
    Sluice watches Twitch drop campaigns for you and claims the rewards, without a
    browser. The same daemon and dashboard as the Docker build, as a desktop app.
  maintainer: loversama <loversama@users.noreply.github.com>
  vendor: loversama
  desktop:
    entry:
      Comment: Mine Twitch drops in the background
      Keywords: twitch;drops;miner;
  target:
    # The AppImage is the one that updates itself; a deb update needs a password, so the
    # app leaves installing it to the user. See installsOnQuit in auto-update.ts.
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # Linux trays and window icons take PNGs. The ICOs above still ship; they are a few KB.
  extraResources:
    - from: "resources/icon.png"
      to: "icon.png"
    - from: "resources/tray-light.png"
      to: "tray-light.png"
    - from: "resources/tray-dark.png"
      to: "tray-dark.png"

# Both names avoid spaces for the reason given at artifactName above, and neither uses
# ${name}: that is "@sluice/desktop", and a slash in a file name is a directory.
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  packageName: sluice
  artifactName: sluice_${version}_${arch}.${ext}

nsis:
  # Per-user, no elevation. Hearth asks for administrator because it installs a Windows
  # service; this mines drops and has no business holding that.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sluice
  deleteAppDataOnUninstall: false
  # The wizard's artwork is picked up from buildResources by name -
  # resources/installerHeaderIcon.ico and resources/installerSidebar.bmp - so there is
  # nothing to point at here. Without the sidebar the uninstaller's welcome page falls back
  # to nsis3-metro.bmp, a stock NSIS graphic. Both are generated by scripts/make-icons.py;
  # do not delete them expecting the app icon to stand in.

publish:
  provider: github
  owner: loversama
  repo: sluice-releases
  # A separate, public repository holding installers and nothing else. The source stays
  # private in loversama/sluice.
  #
  # Public because the alternative is worse. Reading a private repo's releases needs a
  # token, and the only way to give the installer one is to build it in, where anyone can
  # extract it - and GitHub has no "release assets only" permission, so such a token can
  # always read something. A public repo of installers hands out exactly what an installer
  # already is, with no credential to leak, expire, or rotate.
  private: false
  vPrefixedTagName: true
  releaseType: release
