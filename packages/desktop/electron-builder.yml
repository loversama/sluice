appId: dev.loversama.sluice
productName: Sluice
copyright: Copyright © 2026

directories:
  output: release/${version}
  buildResources: resources

files:
  - "out/**/*"
  - "!out/**/*.map"

# The dashboard is the same build the container serves. Shipped outside the asar so the
# server reads it with ordinary file APIs, exactly as it does under Docker.
extraResources:
  - from: "../../web/dist"
    to: "web"
  - from: "resources/icon.ico"
    to: "icon.ico"
  # Both tray marks ship: which one is used depends on the taskbar's theme at run time.
  - from: "resources/tray-light.ico"
    to: "tray-light.ico"
  - from: "resources/tray-dark.ico"
    to: "tray-dark.ico"

asar: true
compression: maximum

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Per-user, no elevation. Hearth asks for administrator because it installs a Windows
  # service; this mines drops and has no business holding that.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sluice
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: loversama
  repo: sluice-releases
  # A separate, public repository holding installers and nothing else. The source stays
  # private in loversama/sluice.
  #
  # Public because the alternative is worse. Reading a private repo's releases needs a
  # token, and the only way to give the installer one is to build it in, where anyone can
  # extract it - and GitHub has no "release assets only" permission, so such a token can
  # always read something. A public repo of installers hands out exactly what an installer
  # already is, with no credential to leak, expire, or rotate.
  private: false
  vPrefixedTagName: true
  releaseType: release
