appId: dev.loversama.sluice
productName: Sluice
copyright: Copyright © 2026

directories:
  output: release/${version}
  buildResources: resources

files:
  - "out/**/*"
  - "!out/**/*.map"

# The dashboard is the same build the container serves. Shipped outside the asar so the
# server reads it with ordinary file APIs, exactly as it does under Docker.
extraResources:
  - from: "../../web/dist"
    to: "web"
  - from: "resources/icon.ico"
    to: "icon.ico"

asar: true
compression: maximum

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Per-user, no elevation. Hearth asks for administrator because it installs a Windows
  # service; this mines drops and has no business holding that.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sluice
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: loversama
  repo: sluice-releases
  # A separate, private repository holding installers and nothing else.
  #
  # The updater needs a token to read a private repo's releases, and the only way to give
  # the installer one is to build it in - where anyone can extract it. GitHub has no
  # "release assets only" permission: contents:read covers the source too. Keeping the
  # releases apart from the source means an extracted token grants read access to
  # installers, which is precisely what the person holding it already had.
  private: true
  vPrefixedTagName: true
  releaseType: release
